# Template. deploy/setup-server.sh fills in the __PLACEHOLDERS__ and installs it.
# Certbot adds the HTTPS settings afterwards.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __APP_DIR__/public;
    index index.php;

    # Real files (like site.css) are served directly; everything else goes to index.php.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php__PHP_VER__-fpm.sock;
    }

    # Never serve hidden files.
    location ~ /\. {
        deny all;
    }
}
